[package]
name = "localbrain-desktop"
version = "0.1.0"
description = "LocalBrain desktop shell — spawns the FastAPI backend and hosts the React chat UI"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "localbrain_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
