<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LocalBrain</title>
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --border: #2a2d3a;
      --text: #e1e4ed;
      --muted: #7b82a0;
      --accent: #6c8cff;
      --accent-hover: #5a7aee;
      --user-bg: #1e2233;
      --ai-bg: #15182a;
      --radius: 10px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* --- header ----------------------------------------------------------- */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    header h1 { font-size: 1.1rem; font-weight: 600; letter-spacing: -0.02em; }
    header .controls { display: flex; gap: 10px; align-items: center; }
    header select {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 5px 10px;
      font-size: 0.85rem;
      cursor: pointer;
    }
    header button {
      background: var(--bg);
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 5px 12px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: color 0.15s;
    }
    header button:hover { color: var(--text); border-color: var(--muted); }

    /* --- chat area -------------------------------------------------------- */
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .msg {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: var(--radius);
      line-height: 1.55;
      font-size: 0.92rem;
      animation: fadeIn 0.15s ease;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

    .msg.user {
      align-self: flex-end;
      background: var(--user-bg);
      border: 1px solid var(--border);
    }
    .msg.ai {
      align-self: flex-start;
      background: var(--ai-bg);
      border: 1px solid var(--border);
    }
    .msg.system {
      align-self: center;
      background: transparent;
      color: var(--muted);
      font-size: 0.82rem;
    }

    .msg .label {
      font-size: 0.72rem;
      color: var(--muted);
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    /* --- sources panel ---------------------------------------------------- */
    .sources {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--border);
    }
    .sources summary {
      cursor: pointer;
      font-size: 0.8rem;
      color: var(--accent);
      user-select: none;
    }
    .sources .tag {
      display: inline-block;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 2px 7px;
      font-size: 0.78rem;
      margin: 4px 4px 0 0;
      color: var(--muted);
    }

    /* --- markdown-rendered answer body ----------------------------------- */
    .msg .md { overflow-wrap: break-word; }
    .msg .md > *:first-child { margin-top: 0; }
    .msg .md > *:last-child { margin-bottom: 0; }
    .msg .md p { margin: 6px 0; }
    .msg .md h1, .msg .md h2, .msg .md h3, .msg .md h4 {
      margin: 10px 0 6px;
      line-height: 1.3;
      letter-spacing: -0.01em;
    }
    .msg .md h1 { font-size: 1.15rem; }
    .msg .md h2 { font-size: 1.05rem; }
    .msg .md h3 { font-size: 0.97rem; }
    .msg .md ul, .msg .md ol { margin: 6px 0; padding-left: 22px; }
    .msg .md li { margin: 3px 0; }
    .msg .md code {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1px 5px;
      font-size: 0.85em;
      font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace;
    }
    .msg .md pre {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 12px;
      margin: 8px 0;
      overflow-x: auto;
    }
    .msg .md pre code {
      background: none;
      border: none;
      padding: 0;
      font-size: 0.85rem;
    }
    .msg .md blockquote {
      border-left: 3px solid var(--accent);
      padding-left: 12px;
      margin: 8px 0;
      color: var(--muted);
    }
    .msg .md a { color: var(--accent); text-decoration: none; }
    .msg .md a:hover { text-decoration: underline; }
    .msg .md table {
      border-collapse: collapse;
      margin: 8px 0;
      font-size: 0.85rem;
      max-width: 100%;
      overflow-x: auto;
    }
    .msg .md th, .msg .md td {
      border: 1px solid var(--border);
      padding: 5px 10px;
      text-align: left;
    }
    .msg .md th { background: var(--bg); font-weight: 600; }
    .msg .md strong { font-weight: 600; }
    .msg .md em { font-style: italic; }

    /* --- input ------------------------------------------------------------ */
    #input-bar {
      padding: 12px 20px;
      border-top: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      gap: 10px;
    }
    #input-bar textarea {
      flex: 1;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.92rem;
      font-family: inherit;
      resize: none;
      min-height: 42px;
      max-height: 120px;
      line-height: 1.45;
    }
    #input-bar textarea:focus { outline: none; border-color: var(--accent); }
    #input-bar button {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0 20px;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }
    #input-bar button:hover { background: var(--accent-hover); }
    #input-bar button:disabled { opacity: 0.4; cursor: not-allowed; }
  </style>
</head>
<body>
  <header>
    <h1>🧠 LocalBrain</h1>
    <div class="controls">
      <select id="workspace-select">
        <option value="default">Default</option>
      </select>
      <button id="btn-clear" title="Clear history">Clear</button>
      <button id="btn-reindex" title="Re-index vault">Re-index</button>
    </div>
  </header>

  <div id="chat"></div>

  <div id="input-bar">
    <textarea id="input" placeholder="Ask a question…" rows="1"></textarea>
    <button id="btn-send">Send</button>
  </div>

  <script>
    const chat    = document.getElementById('chat');
    const input   = document.getElementById('input');
    const btnSend = document.getElementById('btn-send');
    const btnClear= document.getElementById('btn-clear');
    const btnIdx  = document.getElementById('btn-reindex');
    const wsSel   = document.getElementById('workspace-select');

    /* ---- helpers --------------------------------------------------------- */
    function renderSources(div, sources) {
      if (!sources || !sources.length) return;
      let srcWrap = div.querySelector('.sources');
      if (!srcWrap) {
        srcWrap = document.createElement('div');
        srcWrap.className = 'sources';
        div.appendChild(srcWrap);
      }
      srcWrap.innerHTML = '';
      const details = document.createElement('details');
      const summary = document.createElement('summary');
      summary.textContent = `Sources (${sources.length})`;
      details.appendChild(summary);
      sources.forEach(s => {
        const tag = document.createElement('span');
        tag.className = 'tag';
        tag.textContent = s;
        details.appendChild(tag);
      });
      srcWrap.appendChild(details);
    }

    function addMsg(role, content, sources) {
      const div = document.createElement('div');
      div.className = `msg ${role}`;

      const label = document.createElement('div');
      label.className = 'label';
      label.textContent = role === 'user' ? 'You' : 'LocalBrain';
      div.appendChild(label);

      const body = document.createElement('div');
      body.className = 'md';
      div.appendChild(body);

      if (sources && sources.length) {
        renderSources(div, sources);
      }

      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    /* ---- minimal, dependency-free Markdown renderer --------------------- */
    // Renders the (already safe) markdown the LLM produces: headings, lists,
    // bold/italic, inline code, fenced code blocks, tables, links, quotes.
    // HTML in the response is escaped first, so this is XSS-safe.

    function escapeHtml(s) {
      return s
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function inlineMd(s) {
      // escape first, then apply inline formatting
      return escapeHtml(s)
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
        .replace(/\*([^*]+)\*/g, '<em>$1</em>')
        .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" rel="noopener">$1</a>');
    }

    function renderMarkdown(md) {
      if (!md) return '';
      const lines = md.split('\n');
      const out = [];
      let i = 0;
      let listType = null;   // 'ul' | 'ol' | null
      let inCode = false;
      let codeBuf = [];
      let table = [];        // accumulating table rows

      function closeList() {
        if (listType) { out.push(`</${listType}>`); listType = null; }
      }
      function flushTable() {
        if (!table.length) return;
        let h = '<table>';
        table.forEach((row, r) => {
          h += '<tr>';
          row.forEach(cell => {
            const tag = r === 0 ? 'th' : 'td';
            h += `<${tag}>${inlineMd(cell.trim())}</${tag}>`;
          });
          h += '</tr>';
        });
        out.push(h + '</table>');
        table = [];
      }

      for (; i < lines.length; i++) {
        const raw = lines[i];
        const line = raw.trimEnd();

        // fenced code blocks
        if (line.trim().startsWith('```')) {
          closeList(); flushTable();
          if (inCode) {
            out.push('<pre><code>' + escapeHtml(codeBuf.join('\n')) + '</code></pre>');
            codeBuf = []; inCode = false;
          } else { inCode = true; }
          continue;
        }
        if (inCode) { codeBuf.push(line); continue; }

        // headers
        const h = /^(#{1,4})\s+(.*)$/.exec(line);
        if (h) {
          closeList(); flushTable();
          const level = h[1].length;
          out.push(`<h${level}>${inlineMd(h[2])}</h${level}>`);
          continue;
        }

        // tables (adjacent pipe lines, with a separator row)
        if (line.startsWith('|') && line.endsWith('|')) {
          closeList();
          const cells = line.slice(1, -1).split('|');
          const isSep = cells.every(c => /^:?-{3,}:?$/.test(c.trim()));
          if (isSep) continue;  // skip the |---| separator, keep header row
          table.push(cells);
          continue;
        }
        flushTable();

        // blockquote
        if (line.startsWith('> ')) {
          closeList();
          out.push(`<blockquote>${inlineMd(line.slice(2))}</blockquote>`);
          continue;
        }

        // unordered / ordered lists (grouped)
        let m = /^[-*]\s+(.*)$/.exec(line.trim());
        if (m) {
          if (listType !== 'ul') { closeList(); out.push('<ul>'); listType = 'ul'; }
          out.push(`<li>${inlineMd(m[1])}</li>`);
          continue;
        }
        m = /^\d+\.\s+(.*)$/.exec(line.trim());
        if (m) {
          if (listType !== 'ol') { closeList(); out.push('<ol>'); listType = 'ol'; }
          out.push(`<li>${inlineMd(m[1])}</li>`);
          continue;
        }
        closeList();

        // blank line: paragraph break
        if (!line.trim()) continue;
        out.push(`<p>${inlineMd(line)}</p>`);
      }
      closeList(); flushTable();
      if (inCode) { out.push('<pre><code>' + escapeHtml(codeBuf.join('\n')) + '</code></pre>'); }
      return out.join('\n');
    }

    /* ---- auto-resize textarea -------------------------------------------- */
    input.addEventListener('input', () => {
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 120) + 'px';
    });
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
    });

    /* ---- send ------------------------------------------------------------ */
    let sending = false;
    async function send() {
      const text = input.value.trim();
      if (!text || sending) return;
      sending = true;
      btnSend.disabled = true;
      input.value = '';
      input.style.height = 'auto';
      addMsg('user', text);

      const ws = wsSel.value;
      const aiDiv = addMsg('ai', '');
      const body = aiDiv.querySelector('div.md');
      let full = '';

      try {
        const res = await fetch('/api/query/stream', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question: text, workspace: ws }),
        });

        if (!res.ok) {
          let errText = `HTTP ${res.status}`;
          try {
            const errJson = await res.json();
            if (errJson.detail) errText = typeof errJson.detail === 'string' ? errJson.detail : JSON.stringify(errJson.detail);
          } catch {}
          body.textContent = `Error: ${errText}`;
          sending = false;
          btnSend.disabled = false;
          input.focus();
          return;
        }

        const reader = res.body.getReader();
        const dec = new TextDecoder();
        let buffer = '';

        function processLines(lines) {
          for (const line of lines) {
            const trimmed = line.trim();
            if (!trimmed.startsWith('data: ')) continue;
            try {
              const msg = JSON.parse(trimmed.slice(6));
              if (msg.type === 'token') {
                full += msg.data;
                body.innerHTML = renderMarkdown(full);
              } else if (msg.type === 'source_documents') {
                renderSources(aiDiv, msg.data);
              }
            } catch {}
          }
        }

        while (true) {
          const { done, value } = await reader.read();
          if (done) {
            if (buffer.trim()) {
              processLines(buffer.split('\n'));
            }
            break;
          }
          buffer += dec.decode(value, { stream: true });
          const lines = buffer.split('\n');
          buffer = lines.pop(); // carry incomplete line over to next chunk
          processLines(lines);
        }
      } catch (err) {
        full = `Error: ${err.message}`;
        body.textContent = full;
      }

      sending = false;
      btnSend.disabled = false;
      input.focus();
    }

    btnSend.addEventListener('click', send);

    /* ---- clear history --------------------------------------------------- */
    btnClear.addEventListener('click', async () => {
      await fetch(`/api/history?workspace=${wsSel.value}`, { method: 'DELETE' });
      chat.innerHTML = '';
      addMsg('system', 'History cleared.');
    });

    /* ---- re-index vault -------------------------------------------------- */
    btnIdx.addEventListener('click', async () => {
      btnIdx.textContent = 'Indexing…';
      const res = await fetch('/api/vault/ingest', { method: 'POST' });
      const data = await res.json();
      addMsg('system', `Indexed ${data.chunks} chunks from the vault.`);
      btnIdx.textContent = 'Re-index';
    });

    /* ---- workspace selector ---------------------------------------------- */
    async function loadWorkspaces() {
      try {
        const res = await fetch('/api/workspaces');
        const data = await res.json();
        wsSel.innerHTML = '';
        data.workspaces.forEach(ws => {
          const opt = document.createElement('option');
          opt.value = ws; opt.textContent = ws;
          wsSel.appendChild(opt);
        });
        if (!data.workspaces.includes('default')) {
          const opt = document.createElement('option');
          opt.value = 'default'; opt.textContent = 'default';
          wsSel.appendChild(opt);
        }
      } catch {}
    }
    loadWorkspaces();

    /* ---- boot message ---------------------------------------------------- */
    addMsg('system', 'Ask a question about your vault, or type anything.');
  </script>
</body>
</html>
